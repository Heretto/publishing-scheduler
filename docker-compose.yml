services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    # Everything in .env is passed through, so optional settings (SSO, Heretto
    # tuning, SMTP) work without being listed here. Optional so a fresh clone
    # with no .env still parses.
    env_file:
      - path: .env
        required: false
    environment:
      # The SQLite file must live on the db-data volume, so this overrides .env.
      - DATABASE_URL=sqlite:////app/data/scheduler.db
      - APP_ENV=${APP_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4200}
      # Required by hop-core with no defaults. Guarded so compose fails with a
      # readable message instead of a pydantic traceback inside the container.
      - APP_SECRET_KEY=${APP_SECRET_KEY:?not set — add it to .env, see .env.example}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?not set — add it to .env, see .env.example}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?not set — add it to .env, see .env.example}
    volumes:
      - db-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    # nginx resolves the "backend" upstream when it parses its config at
    # startup, so it needs the backend container already up.
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
